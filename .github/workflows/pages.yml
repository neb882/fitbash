# Publishes the page (the public/ folder) to GitHub Pages, after the tests pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing is published from a commit whose tests fail.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
